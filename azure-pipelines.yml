trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - "*.md"
      - "docs/**"
      - "design_system/**"

pr:
  branches:
    include:
      - main

variables:
  # Override in the pipeline UI or a variable group for secrets.
  ACR_NAME: "$(ACR_NAME)"           # e.g. myregistry
  IMAGE_REPO: "$(ACR_NAME).azurecr.io/data-dictionary"
  K8S_NAMESPACE: "data-dictionary"
  K8S_CONNECTION: "$(K8S_SERVICE_CONNECTION)"  # AKS service connection name
  HELM_RELEASE: "data-dictionary"
  HELM_VALUES_FILE: "charts/data-dictionary/values-prod.yaml"

stages:

# ── 1. Test ───────────────────────────────────────────────────────────────────

  - stage: Test
    displayName: Lint & Test
    jobs:
      - job: pytest
        displayName: Run test suite
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
              addToPath: true

          - script: |
              pip install --upgrade pip
              pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt
            displayName: Install dependencies

          - script: |
              python scripts/auto_ci.py --junit-xml test-results.xml
            displayName: pytest
            env:
              ENABLE_MOCK_AUTH: "true"
              ENVIRONMENT: development

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFiles: test-results.xml
              testRunTitle: "pytest"

      - job: helm_validate
        displayName: Validate Helm chart
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: latest

          - script: |
              helm lint --strict charts/data-dictionary
              helm lint --strict charts/data-dictionary -f charts/data-dictionary/values-showcase.yaml
              helm lint --strict charts/data-dictionary -f charts/data-dictionary/values-prod.yaml
              helm template dd-default charts/data-dictionary > /dev/null
              helm template dd-showcase charts/data-dictionary -f charts/data-dictionary/values-showcase.yaml > /dev/null
              helm template dd-prod charts/data-dictionary -f charts/data-dictionary/values-prod.yaml > /dev/null
              if helm template dd-invalid charts/data-dictionary \
                --set config.environment=production \
                --set config.features.enableMockAuth=true > /dev/null 2>&1; then
                echo "ERROR: values.schema.json failed to reject enableMockAuth=true in production"
                exit 1
              fi
            displayName: Lint and render Helm templates

# ── 2. Build ──────────────────────────────────────────────────────────────────

  - stage: Build
    displayName: Build & Push image
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: docker_build
        displayName: Build Docker image
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: ACR login
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: az acr login --name $(ACR_NAME)

          - task: Docker@2
            displayName: Build and push
            inputs:
              command: buildAndPush
              containerRegistry: "$(ACR_DOCKER_SERVICE_CONNECTION)"
              repository: data-dictionary
              dockerfile: Dockerfile
              tags: |
                $(Build.BuildId)
                latest

# ── 3. Deploy ─────────────────────────────────────────────────────────────────

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy_aks
        displayName: Helm upgrade
        environment: production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: HelmInstaller@1
                  displayName: Install Helm
                  inputs:
                    helmVersionToInstall: latest

                - bash: |
                    if [ -n "${PULL_SECRET_VAL}" ] && [ "${PULL_SECRET_VAL}" != '$(IMAGE_PULL_SECRET)' ]; then
                      echo "##vso[task.setvariable variable=EXTRA_HELM_ARGS]--set image.pullSecrets[0].name=${PULL_SECRET_VAL}"
                    else
                      echo "##vso[task.setvariable variable=EXTRA_HELM_ARGS]"
                    fi
                  displayName: Resolve optional Helm overrides
                  env:
                    PULL_SECRET_VAL: $(IMAGE_PULL_SECRET)

                - task: HelmDeploy@0
                  displayName: Helm upgrade --install
                  inputs:
                    connectionType: Kubernetes Service Connection
                    kubernetesServiceConnection: $(K8S_CONNECTION)
                    namespace: $(K8S_NAMESPACE)
                    command: upgrade
                    install: true
                    waitForExecution: true
                    chartType: FilePath
                    chartPath: charts/data-dictionary
                    releaseName: $(HELM_RELEASE)
                    valueFile: $(HELM_VALUES_FILE)
                    overrideValues: image.repository=$(IMAGE_REPO),image.tag=$(Build.BuildId)
                    arguments: --create-namespace --atomic --timeout 5m $(EXTRA_HELM_ARGS)

                - task: Kubernetes@1
                  displayName: Verify Helm release workloads
                  inputs:
                    connectionType: kubernetesServiceConnection
                    kubernetesServiceEndpoint: $(K8S_CONNECTION)
                    namespace: $(K8S_NAMESPACE)
                    command: get
                    arguments: deployments,pods,svc,ingress -l app.kubernetes.io/instance=$(HELM_RELEASE)
