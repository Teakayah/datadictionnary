services:
  dd-redis:
    profiles: ["api"]
    image: redis:7.2.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  dd-app:
    build:
      context: .
    ports:
      - "127.0.0.1:8501:8501"
    command:
      - /bin/sh
      - -ec
      - |
        if [ ! -s "$${DUCKDB_PATH}" ]; then
          python scripts/generate_test_data.py --seed 42 --tables 600 --out "$${DUCKDB_PATH}"
        fi
        exec streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    environment:
      ENVIRONMENT: development
      ENABLE_MOCK_AUTH: "true"
      DEMO_DATA: "false"
      DUCKDB_PATH: /data/demo-catalog.duckdb
      ADMIN_GROUPS: mock_admin_group
      EDITOR_GROUPS: mock_admin_group,finance_group,research_group,hr_group,it_group

  dd-api:
    profiles: ["api"]
    build:
      context: .
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: development
      DEMO_DATA: "true"
      TENANT_ID: demo-tenant
      CLIENT_ID: demo-client
      REDIS_URL: redis://dd-redis:6379
    depends_on:
      dd-redis:
        condition: service_healthy

  dd-sync-worker:
    profiles: ["sync"]
    build:
      context: .
    command: ["python", "-m", "src.sync.daemon"]
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
    environment:
      DUCKDB_PATH: /data/test_data.duckdb
      SYNC_HEALTHZ_PORT: "8765"
