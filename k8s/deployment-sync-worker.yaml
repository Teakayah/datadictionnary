apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-sync-worker
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: sync-worker
    app.kubernetes.io/version: ${IMAGE_TAG}
    app.kubernetes.io/part-of: data-dictionary
    app.kubernetes.io/managed-by: kubectl
  annotations:
    deployment.kubernetes.io/image: ghcr.io/org/data-dictionary:${IMAGE_TAG}
spec:
  # Singleton — DuckDB only allows one writer per file. Scaling beyond 1
  # requires migrating user_data to PostgreSQL (TODO.md follow-up).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-sync-worker
  template:
    metadata:
      labels:
        app: dd-sync-worker
        app.kubernetes.io/name: data-dictionary
        app.kubernetes.io/component: sync-worker
        app.kubernetes.io/version: ${IMAGE_TAG}
        app.kubernetes.io/part-of: data-dictionary
        app.kubernetes.io/managed-by: kubectl
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: sync-worker
          image: ghcr.io/org/data-dictionary:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.sync.daemon"]

          ports:
            - name: healthz
              containerPort: 8765
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
              ephemeral-storage: "1Gi"

          envFrom:
            - configMapRef:
                name: dd-config
            - secretRef:
                name: dd-secrets

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

          # Liveness: the daemon writes a heartbeat each loop and /healthz
          # returns 503 if the heartbeat is older than 60s.
          livenessProbe:
            httpGet:
              path: /healthz?probe=liveness
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /healthz?probe=readiness
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # SIGTERM grace — let the current cycle finish (max DR_RESYNC pass).
          # The daemon's signal handler sets _stop_event and exits the loop.

      terminationGracePeriodSeconds: 60

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dd-data
        - name: tmp
          emptyDir: {}
