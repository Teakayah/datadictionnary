apiVersion: v1
kind: ResourceQuota
metadata:
  name: dd-namespace-quota
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: resource-quota
    app.kubernetes.io/part-of: data-dictionary
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: ${IMAGE_TAG}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "6Gi"
    limits.cpu: "12"
    limits.memory: "12Gi"
