apiVersion: v1
kind: Service
metadata:
  name: dd-api
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app: dd-api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
