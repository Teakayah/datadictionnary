# Replace each value below with the base64-encoded form of your secret:
#   echo -n 'your-value' | base64
#
# IMPORTANT: Never commit real values to source control.
# Consider using a secrets manager (e.g. Vault, Sealed Secrets, AWS Secrets Manager)
# to inject these at deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: dd-secrets
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: data-dictionary
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: ${IMAGE_TAG}
type: Opaque
data:
  # Databricks connection
  # echo -n 'your-value' | base64
  DATABRICKS_HOST: cGxhY2Vob2xkZXI=
  DATABRICKS_HTTP_PATH: cGxhY2Vob2xkZXI=
  DATABRICKS_TOKEN: cGxhY2Vob2xkZXI=

  # Entra ID / MSAL OAuth
  # echo -n 'your-value' | base64
  TENANT_ID: cGxhY2Vob2xkZXI=
  CLIENT_ID: cGxhY2Vob2xkZXI=
  CLIENT_SECRET: cGxhY2Vob2xkZXI=

  # SMTP (optional — for notification features)
  # echo -n 'your-value' | base64
  SMTP_HOST: cGxhY2Vob2xkZXI=
  SMTP_PORT: cGxhY2Vob2xkZXI=
  SMTP_USER: cGxhY2Vob2xkZXI=
  SMTP_PASSWORD: cGxhY2Vob2xkZXI=
  SMTP_FROM: cGxhY2Vob2xkZXI=

  # Role-based access control group IDs (comma-separated AD Object IDs)
  # echo -n 'your-value' | base64
  EDITOR_GROUPS: cGxhY2Vob2xkZXI=
  ADMIN_GROUPS: cGxhY2Vob2xkZXI=
