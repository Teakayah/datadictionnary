apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-app-network-policy
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: dd-app

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Allow traffic from the ingress controller namespace only.
    # The ingress controller namespace must carry the label
    # kubernetes.io/metadata.name=ingress-nginx (or your controller's namespace).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8501

  egress:
    # Allow HTTPS egress only (covers Databricks SQL Warehouse and Entra ID).
    - ports:
        - protocol: TCP
          port: 443
    # API server
    - to:
        - podSelector:
            matchLabels:
              app: dd-api
      ports:
        - protocol: TCP
          port: 8080
    # Redis cache.
    - to:
        - podSelector:
            matchLabels:
              app: dd-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution so the app can resolve external hostnames.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-api-network-policy
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: dd-api

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # REST / MCP traffic from the ingress controller (external clients).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # Intra-cluster callers within this namespace (e.g. dd-app sidecar calls).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: data-dictionary
      ports:
        - protocol: TCP
          port: 8080

  egress:
    # Entra ID JWKS + OIDC, Databricks SQL Warehouse, Microsoft Graph.
    - ports:
        - protocol: TCP
          port: 443
    # Redis cache.
    - to:
        - podSelector:
            matchLabels:
              app: dd-redis
      ports:
        - protocol: TCP
          port: 6379
    # DNS resolution.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-sync-network-policy
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - dd-sync
          - dd-sync-worker

  policyTypes:
    - Ingress
    - Egress

  ingress: [] # Deny all ingress

  egress:
    # Allow HTTPS egress only (covers Databricks SQL Warehouse and Entra ID).
    - ports:
        - protocol: TCP
          port: 443
    # Redis cache.
    - to:
        - podSelector:
            matchLabels:
              app: dd-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS resolution so the app can resolve external hostnames.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dd-redis-network-policy
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app: dd-redis

  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Accept connections only from pods that are part of this application.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: data-dictionary
      ports:
        - protocol: TCP
          port: 6379

  egress: []
