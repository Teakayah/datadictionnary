apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dd-ingress
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: data-dictionary
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: ${IMAGE_TAG}
  annotations:
    # Ingress controller
    kubernetes.io/ingress.class: nginx

    # TLS — cert-manager issues the certificate automatically
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # WebSocket support required by Streamlit
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

    # Proxy buffer tuning for Streamlit's SSE / WS frames
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  tls:
  - hosts:
    - datadictionary.internal
    secretName: dd-tls-cert
  rules:
  - host: datadictionary.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dd-service
            port:
              number: 8501
