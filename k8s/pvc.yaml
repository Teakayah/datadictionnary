apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dd-data
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: data-dictionary
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/version: ${IMAGE_TAG}
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  # storageClassName must be set to a ReadWriteMany-capable class for your cluster.
  # Operators must override this before applying. Common values:
  #   AWS EFS CSI:   efs-sc
  #   Azure Files:   azurefile-csi
  #   GCP Filestore: standard-rwx
  #   On-prem NFS:   nfs-client
  # Example: storageClassName: efs-sc
  storageClassName: standard
