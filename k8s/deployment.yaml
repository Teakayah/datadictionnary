apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-app
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: app
  annotations:
    # Update this tag and roll the deployment when publishing a new image
    deployment.kubernetes.io/image: ghcr.io/org/data-dictionary:${IMAGE_TAG}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dd-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dd-app
        app.kubernetes.io/name: data-dictionary
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: data-dictionary
          image: ghcr.io/org/data-dictionary:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            # Set to false: Streamlit writes temp files at runtime
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          envFrom:
            - configMapRef:
                name: dd-config
            - secretRef:
                name: dd-secrets

          volumeMounts:
            - name: data
              mountPath: /data

          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dd-data

      # Prevent two replicas landing on the same node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - dd-app
                topologyKey: kubernetes.io/hostname
