apiVersion: apps/v1
kind: Deployment
metadata:
  name: dd-app
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: app
    app.kubernetes.io/version: ${IMAGE_TAG}
    app.kubernetes.io/part-of: data-dictionary
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # Update this tag and roll the deployment when publishing a new image
    deployment.kubernetes.io/image: ghcr.io/org/data-dictionary:${IMAGE_TAG}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dd-app
  template:
    metadata:
      labels:
        app: dd-app
        app.kubernetes.io/name: data-dictionary
        app.kubernetes.io/component: app
        app.kubernetes.io/version: ${IMAGE_TAG}
        app.kubernetes.io/part-of: data-dictionary
        app.kubernetes.io/managed-by: kubectl
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      containers:
        - name: data-dictionary
          image: ghcr.io/org/data-dictionary:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP

          securityContext:
            seccompProfile:
              type: RuntimeDefault
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "1Gi"

          envFrom:
            - configMapRef:
                name: dd-config
            - secretRef:
                name: dd-secrets

          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /_stcore/health?probe=liveness
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /_stcore/health?probe=readiness
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dd-data
        - name: tmp
          emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: dd-app
                topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dd-app
