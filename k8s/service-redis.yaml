apiVersion: v1
kind: Service
metadata:
  name: dd-redis
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app: dd-redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
