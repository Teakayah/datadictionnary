apiVersion: batch/v1
kind: CronJob
metadata:
  name: dd-sync
  namespace: data-dictionary
  labels:
    app.kubernetes.io/name: data-dictionary
    app.kubernetes.io/component: sync-job
    app.kubernetes.io/version: ${IMAGE_TAG}
    app.kubernetes.io/part-of: data-dictionary
    app.kubernetes.io/managed-by: kubectl
spec:
  # Run every day at 03:00 UTC
  schedule: "0 3 * * *"
  startingDeadlineSeconds: 300
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: dd-sync
            app.kubernetes.io/name: data-dictionary
            app.kubernetes.io/component: sync-job
            app.kubernetes.io/version: ${IMAGE_TAG}
            app.kubernetes.io/part-of: data-dictionary
            app.kubernetes.io/managed-by: kubectl
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001

          containers:
            - name: sync
              image: ghcr.io/org/data-dictionary:${IMAGE_TAG}
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/nightly_sync.py"]

              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL

              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                  ephemeral-storage: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
                  ephemeral-storage: "1Gi"

              envFrom:
                - configMapRef:
                    name: dd-config
                - secretRef:
                    name: dd-secrets

              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: dd-data
            - name: tmp
              emptyDir: {}
