name: CI / CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/org/data-dictionary

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. TEST — runs on every push to main and on every PR
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests (excluding load tests)
        run: pytest tests/ -q --tb=short --ignore=tests/load
        env:
          ENABLE_MOCK_AUTH: "true"
          ENVIRONMENT: development

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BUILD — push to main only, after test passes
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SHA_TAG="sha-${{ github.sha }}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building tags: ${IMAGE_NAME}:${SHA_TAG}, ${IMAGE_NAME}:latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY — after build, on push to main
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://datadictionary.internal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Substitute image tag in deployment manifest
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image_tag }}"
          sed -i "s|image: .*data-dictionary.*|image: ${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" k8s/deployment.yaml
          echo "Deploying image: ${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/dd-app -n data-dictionary --timeout=120s

      - name: Verify deployment health
        run: |
          kubectl get pods -n data-dictionary -l app=dd-app
          kubectl get svc -n data-dictionary

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. RELEASE — triggered on tags matching v*.*.*
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Build release image and create GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog

      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_NAME }}:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Release ${{ steps.tag.outputs.version }}"
          generate_release_notes: true
          body: |
            ## Docker image

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ```

            Full changelog is auto-generated below.
