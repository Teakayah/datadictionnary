name: Auto-CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-docs:
    name: Lint & Docs Sync
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check app.py src/ scripts/ tests/ --ignore E501
        continue-on-error: true

      - name: Verify docs and HTML synchronization
        run: python scripts/auto_ci.py --skip-tests

  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt -r requirements-dev.txt

      - name: Run shared CI checks
        run: python scripts/auto_ci.py --junit-xml test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore

      - name: Publish test summary
        if: always()
        run: |
          if [ ! -f test-results.xml ]; then
            echo "## Pytest results" >> "$GITHUB_STEP_SUMMARY"
            echo "JUnit results were not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("test-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          summary = [
              "## Pytest results",
              "",
              f"- Tests: {totals['tests']}",
              f"- Passed: {totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']}",
              f"- Failed: {totals['failures']}",
              f"- Errors: {totals['errors']}",
              f"- Skipped: {totals['skipped']}",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as report:
              report.write("\n".join(summary) + "\n")
          PY

  detect-docker-changes:
    name: Detect Docker build inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - 'requirements.txt'
              - 'constraints.txt'
              - '.streamlit/**'
              - 'scripts/**'
              - 'assets/**'

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies with security constraints
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt
          pip install pip-audit

      # Advisory during showcase/development; switch to false (blocking) before production authorization.
      - name: Run pip-audit
        run: pip-audit --desc
        continue-on-error: true

  helm-validate:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint --strict charts/data-dictionary
          helm lint --strict charts/data-dictionary -f charts/data-dictionary/values-showcase.yaml
          helm lint --strict charts/data-dictionary -f charts/data-dictionary/values-prod.yaml

      - name: Render Helm templates across profiles
        run: |
          helm template dd-default charts/data-dictionary > /dev/null
          helm template dd-showcase charts/data-dictionary -f charts/data-dictionary/values-showcase.yaml > /dev/null
          helm template dd-prod charts/data-dictionary -f charts/data-dictionary/values-prod.yaml > /dev/null
          if helm template dd-invalid charts/data-dictionary \
            --set config.environment=production \
            --set config.features.enableMockAuth=true > /dev/null 2>&1; then
            echo "ERROR: values.schema.json failed to reject enableMockAuth=true in production"
            exit 1
          fi

  docker-validate:
    name: Validate Docker Build
    needs: detect-docker-changes
    if: ${{ !cancelled() && (github.event_name == 'push' || (needs.detect-docker-changes.result == 'success' && needs.detect-docker-changes.outputs.docker == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose configuration
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start and verify the default Docker demo
        run: |
          docker compose up --build --wait --wait-timeout 120
          docker compose exec -T dd-app python - <<'PY'
          from streamlit.testing.v1 import AppTest

          visible_tables = {}
          for persona in ("admin", "finance", "research", "hr", "it"):
              app = AppTest.from_file("app.py", default_timeout=20).run()
              app.selectbox[0].select(persona)
              next(button for button in app.button if button.label == "Sign in").click().run()
              assert not app.error and not app.exception, persona
              assert any(button.key == "nav_admin" for button in app.button) == (persona == "admin")
              visible_tables[persona] = set(app.selectbox(key="catalog_search").options)

          assert len(visible_tables["admin"]) == 2400
          department_tables = [visible_tables[role] for role in ("finance", "research", "hr", "it")]
          assert all(600 <= len(tables) < 2400 for tables in department_tables)
          assert len({frozenset(tables) for tables in department_tables}) == 4
          PY

      - name: Show Docker demo logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the Docker demo
        if: always()
        run: docker compose down
