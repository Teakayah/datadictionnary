{{- if .Values.syncWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "data-dictionary.syncWorkerFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-dictionary.labels" . | nindent 4 }}
    app.kubernetes.io/component: sync-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "data-dictionary.selectorLabels" (dict "ctx" . "component" "sync-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data-dictionary.labels" . | nindent 8 }}
        app.kubernetes.io/component: sync-worker
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "data-dictionary.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.syncWorker.terminationGracePeriodSeconds }}
      containers:
        - name: sync-worker
          image: {{ include "data-dictionary.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - src.sync.daemon
          ports:
            - name: healthz
              containerPort: {{ .Values.syncWorker.port }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.syncWorker.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "data-dictionary.configMapName" . }}
            {{- if or .Values.secrets.create .Values.secrets.existingSecret }}
            - secretRef:
                name: {{ include "data-dictionary.secretName" . }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.storage.mountPath }}
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          {{- if .Values.storage.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "data-dictionary.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.syncWorker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.syncWorker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
