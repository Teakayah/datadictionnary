{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "data-dictionary.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "data-dictionary.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  {{- range $k, $v := .Values.secrets.data }}
  {{ $k }}: {{ $v | toString | b64enc }}
  {{- end }}
{{- end }}
