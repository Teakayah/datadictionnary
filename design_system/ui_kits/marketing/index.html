<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data Dictionary — Sign in</title>
<link rel="icon" href="../../assets/logo-mark.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column}
  #root{display:flex;flex-direction:column;min-height:100vh}
  .page{flex:1;display:flex;flex-direction:column}
  .btn{font-family:var(--font-sans);font-size:14px;font-weight:500;padding:10px 18px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;letter-spacing:-.005em;display:inline-flex;align-items:center;gap:6px;transition:background 120ms var(--ease)}
  .btn:hover{background:var(--ink-90)}
  .btn.sec{background:var(--paper);color:var(--ink)}
  .btn.sec:hover{background:var(--paper-deep)}
  a{color:var(--ink-80)}
  a:hover{color:var(--accent)}
  input:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--ink)}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../app/Icon.jsx"></script>
<script type="text/babel" src="IntranetHeader.jsx"></script>
<script type="text/babel" src="DirectSignIn.jsx"></script>
<script type="text/babel" src="InternalFooter.jsx"></script>
<script type="text/babel">
function Site(){
  return (<div className="page" data-screen-label="01 Sign in">
    <IntranetHeader/>
    <div style={{flex:1}}><DirectSignIn/></div>
    <InternalFooter/>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site/>);
</script>
</body>
</html>
