<!doctype html><html><head><meta charset="utf-8"><title>Paper & Ink</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px 28px;background:var(--paper);font-family:var(--font-sans)}
  .row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .sw{height:64px;border:1px solid var(--ink-10);position:relative}
  .lbl{font-size:11px;color:var(--ink-60);margin-top:6px;display:flex;justify-content:space-between;font-family:var(--font-mono)}
  .lbl b{font-weight:500;color:var(--ink)}
  .group{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:0 0 10px}
</style></head><body>
  <div class="group">Paper · Ink</div>
  <div class="row">
    <div><div class="sw" style="background:#FAF7F0"></div><div class="lbl"><b>paper</b><span>F0</span></div></div>
    <div><div class="sw" style="background:#F2EDE1"></div><div class="lbl"><b>paper-deep</b><span>E1</span></div></div>
    <div><div class="sw" style="background:#E8E1D0"></div><div class="lbl"><b>paper-ink</b><span>D0</span></div></div>
    <div><div class="sw" style="background:#DCD6C8"></div><div class="lbl"><b>ink-10</b><span>C8</span></div></div>
    <div><div class="sw" style="background:#C9C2B4"></div><div class="lbl"><b>ink-20</b><span>B4</span></div></div>
    <div><div class="sw" style="background:#9A9388"></div><div class="lbl"><b>ink-40</b><span>88</span></div></div>
    <div><div class="sw" style="background:#6B645A"></div><div class="lbl" style="color:#6B645A"><b style="color:#3D3830">ink-60</b><span>5A</span></div></div>
    <div><div class="sw" style="background:#14110C"></div><div class="lbl"><b>ink</b><span>0C</span></div></div>
  </div>
</body></html>
