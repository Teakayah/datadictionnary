<!doctype html><html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px 28px;background:var(--paper);font-family:var(--font-sans)}
  .eye{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:0 0 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
  label{display:block;font-size:12px;color:var(--ink-60);margin-bottom:6px}
  .inp{width:100%;box-sizing:border-box;border:1px solid var(--ink-20);background:var(--paper);padding:10px 12px;font-size:14px;border-radius:2px;font-family:var(--font-sans);color:var(--ink)}
  .inp.mono{font-family:var(--font-mono)}
  .inp:focus{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--ink)}
  .search{display:flex;align-items:center;border:1px solid var(--ink);background:var(--paper);padding:10px 12px;gap:8px;border-radius:2px}
  .search svg{stroke:var(--ink-60)}
  .search input{border:0;outline:0;flex:1;background:transparent;font-size:14px;font-family:var(--font-sans);color:var(--ink)}
</style></head><body>
  <div class="eye">Inputs</div>
  <div class="grid">
    <div style="grid-column:1 / -1">
      <label>Search the catalog</label>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="e.g. customer_lifetime_value"></div>
    </div>
    <div><label>Catalog</label><input class="inp mono" value="main"></div>
    <div><label>Schema</label><input class="inp mono" placeholder="sales"></div>
  </div>
</body></html>
