<!doctype html><html><head><meta charset="utf-8"><title>Badges & Tags</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px 28px;background:var(--paper);font-family:var(--font-sans)}
  .eye{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:0 0 14px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tag{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;font-size:11px;font-family:var(--font-mono);border:1px solid var(--ink-20);color:var(--ink-80);border-radius:2px;background:var(--paper)}
  .tag.accent{background:var(--accent-wash);border-color:#E0B9B0;color:var(--accent-ink)}
  .tag.ok{background:var(--forest-wash);border-color:#C7D3C0;color:var(--forest)}
  .tag.warn{background:var(--ochre-wash);border-color:#E0CE9E;color:#7A5512}
  .tag.info{background:var(--deepblue-wash);border-color:#BDCBD9;color:var(--deepblue)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--ink);border-radius:999px}
  .dot{width:6px;height:6px;background:currentColor;border-radius:50%}
</style></head><body>
  <div class="eye">Badges · Tags</div>
  <div class="row" style="margin-bottom:12px">
    <span class="tag">TABLE</span>
    <span class="tag accent">SELECTED</span>
    <span class="tag ok"><span class="dot"></span>fresh</span>
    <span class="tag warn"><span class="dot"></span>stale 2d</span>
    <span class="tag info">PII</span>
    <span class="pill">Beta</span>
  </div>
  <div class="row">
    <span class="tag">catalog: main</span>
    <span class="tag">schema: sales</span>
    <span class="tag">grants: 12</span>
    <span class="tag">rows: 2,341,882</span>
  </div>
</body></html>
