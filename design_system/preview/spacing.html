<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px 28px;background:var(--paper);font-family:var(--font-sans)}
  .eye{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:0 0 14px}
  .scale{display:flex;align-items:flex-end;gap:10px;height:100px}
  .bar{background:var(--ink);width:18px;position:relative}
  .bar::after{content:attr(data-v);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:var(--font-mono);font-size:10px;color:var(--ink-60)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-40);text-align:center;margin-top:4px}
</style></head><body>
  <div class="eye">Spacing · 8pt grid + 4</div>
  <div class="scale">
    <div><div class="bar" data-v="4"  style="height:4px"></div><div class="lbl">s-4</div></div>
    <div><div class="bar" data-v="8"  style="height:8px"></div><div class="lbl">s-8</div></div>
    <div><div class="bar" data-v="12" style="height:12px"></div><div class="lbl">s-12</div></div>
    <div><div class="bar" data-v="16" style="height:16px"></div><div class="lbl">s-16</div></div>
    <div><div class="bar" data-v="24" style="height:24px"></div><div class="lbl">s-24</div></div>
    <div><div class="bar" data-v="32" style="height:32px"></div><div class="lbl">s-32</div></div>
    <div><div class="bar" data-v="48" style="height:48px"></div><div class="lbl">s-48</div></div>
    <div><div class="bar" data-v="64" style="height:64px"></div><div class="lbl">s-64</div></div>
    <div><div class="bar" data-v="96" style="height:96px"></div><div class="lbl">s-96</div></div>
  </div>
</body></html>
