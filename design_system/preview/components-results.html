<!doctype html><html><head><meta charset="utf-8"><title>Result row</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px 28px;background:var(--paper);font-family:var(--font-sans)}
  .eye{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:0 0 12px}
  .row{display:grid;grid-template-columns:140px 1fr auto;gap:18px;padding:14px 16px;border-top:1px solid var(--ink-10);align-items:baseline}
  .row.sel{background:var(--accent-wash)}
  .row.sel .name{color:var(--accent-ink)}
  .path{font-family:var(--font-mono);font-size:11px;color:var(--ink-40)}
  .name{font-family:var(--font-mono);font-size:14px;color:var(--ink);font-weight:500}
  .desc{font-size:13px;color:var(--ink-60);margin-top:2px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-40);text-align:right}
  .hl{background:#F3DFD9;padding:0 2px;color:var(--accent-ink)}
</style></head><body>
  <div class="eye">Search result rows</div>
  <div>
    <div class="row">
      <div class="path">main.sales</div>
      <div><div class="name">dim_<span class="hl">customer</span>s</div><div class="desc">Consolidated customer profile data.</div></div>
      <div class="meta">42 cols · fresh</div>
    </div>
    <div class="row sel">
      <div class="path">main.sales</div>
      <div><div class="name">fct_orders</div><div class="desc">Granular order transaction records.</div></div>
      <div class="meta">18 cols · fresh</div>
    </div>
    <div class="row">
      <div class="path">main.marketing</div>
      <div><div class="name"><span class="hl">customer</span>_ltv</div><div class="desc">Lifetime value model output, refreshed weekly.</div></div>
      <div class="meta">6 cols · 2d</div>
    </div>
  </div>
</body></html>
