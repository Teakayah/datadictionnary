<!doctype html><html><head><meta charset="utf-8"><title>Type · Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px 28px;background:var(--paper)}
  .row{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-40);width:86px;flex-shrink:0}
  .specimen{font-family:var(--font-display);color:var(--ink);line-height:1.02;letter-spacing:-.02em}
  .s104{font-size:64px;font-weight:400;font-variation-settings:"opsz" 144}
  .s72{font-size:44px;font-weight:400;font-variation-settings:"opsz" 96}
  .s48{font-size:28px;font-weight:400;font-variation-settings:"opsz" 48}
</style></head><body>
  <div class="row"><div class="tag">display · 104</div><div class="specimen s104">Catalog</div></div>
  <div class="row"><div class="tag">h1 · 72</div><div class="specimen s72">Find your data</div></div>
  <div class="row"><div class="tag">h2 · 48</div><div class="specimen s48">A reference desk for the warehouse</div></div>
</body></html>
