<!doctype html><html><head><meta charset="utf-8"><title>Type · Body</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px 28px;background:var(--paper)}
  .row{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
  .tag{font-family:var(--font-mono);font-size:11px;color:var(--ink-40);width:108px;flex-shrink:0}
  .h3{font-family:var(--font-display);font-size:22px;font-weight:500;color:var(--ink);font-variation-settings:"opsz" 32;letter-spacing:-.015em}
  .h4{font-family:var(--font-sans);font-size:16px;font-weight:600;color:var(--ink)}
  .lead{font-family:var(--font-sans);font-size:17px;color:var(--ink-80)}
  .body{font-family:var(--font-sans);font-size:15px;color:var(--ink-80)}
  .small{font-family:var(--font-sans);font-size:13px;color:var(--ink-60)}
  .eye{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60)}
</style></head><body>
  <div class="row"><div class="tag">h3 · 32 serif</div><div class="h3">Tables and schemas</div></div>
  <div class="row"><div class="tag">h4 · 18 sans</div><div class="h4">Permission-trimmed results</div></div>
  <div class="row"><div class="tag">lead · 18</div><div class="lead">A card catalog for your warehouse.</div></div>
  <div class="row"><div class="tag">body · 16</div><div class="body">Search tables, columns, and business terms you have access to.</div></div>
  <div class="row"><div class="tag">small · 14</div><div class="small">Updated nightly from Unity Catalog.</div></div>
  <div class="row"><div class="tag">eyebrow · 12</div><div class="eye">Catalog · sales</div></div>
</body></html>
