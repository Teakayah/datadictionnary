<!doctype html><html><head><meta charset="utf-8"><title>Accent</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:22px 28px;background:var(--paper);font-family:var(--font-sans)}
  .group{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-60);margin:0 0 14px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .sw{height:72px;border:1px solid var(--ink-10);display:flex;align-items:flex-end;padding:8px 10px;font-family:var(--font-mono);font-size:11px}
  .lbl{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-60)}
  .lbl b{color:var(--ink);font-weight:500}
  .note{font-size:12px;color:var(--ink-60);margin-top:10px}
</style></head><body>
  <div class="group">Accent · oxidized red</div>
  <div class="row">
    <div><div class="sw" style="background:#B8362A;color:#FAF7F0">Aa</div><div class="lbl"><b>accent</b><span>#B8362A</span></div></div>
    <div><div class="sw" style="background:#8C271E;color:#FAF7F0">Aa</div><div class="lbl"><b>accent-ink</b><span>#8C271E</span></div></div>
    <div><div class="sw" style="background:#F3DFD9;color:#8C271E">Aa</div><div class="lbl"><b>accent-wash</b><span>#F3DFD9</span></div></div>
  </div>
  <p class="note">One accent, one purpose per screen: selected row, primary button, index letter.</p>
</body></html>
