<!DOCTYPE html>
<html>
  <head>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script>
      function sendMessageToStreamlit(type, data) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: type,
          ...data
        }, "*");
      }

      function setComponentValue(value) {
        sendMessageToStreamlit("setComponentValue", { value: value });
      }

      window.addEventListener("message", function(event) {
        if (event.data.type === "streamlit:render") {
          // Initialize component with args
          const args = event.data.args;
          const nodes = new vis.DataSet(args.nodes);
          const edges = new vis.DataSet(args.edges);
          const container = document.getElementById("mynetwork");
          const data = { nodes: nodes, edges: edges };
          const network = new vis.Network(container, data, args.options);

          network.on("selectNode", function(params) {
             if (params.nodes.length > 0) {
                 setComponentValue(params.nodes[0]);
             }
          });

          sendMessageToStreamlit("setFrameHeight", { height: document.body.scrollHeight });
        }
      });

      window.onload = function() {
        sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
      };
    </script>
    <style>
      body { margin: 0; padding: 0; }
      #mynetwork { width: 100%; height: 350px; background: #F2EDE1; border-radius: 4px; border: 1px solid #C9C2B4; }
    </style>
  </head>
  <body>
    <div id="mynetwork"></div>
  </body>
</html>
